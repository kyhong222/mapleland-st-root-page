name: Refresh feedback issues

# 이슈 목록은 빌드 결과물에 구워지므로, 새 건의가 페이지에 뜨려면 재배포가 필요하다.
# 하루 한 번 src/data/issues.json 을 갱신해 커밋하고, 그 push 로 Vercel 이 재배포한다.
on:
  schedule:
    - cron: '0 19 * * *' # 매일 04:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-issues
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch issues
        env:
          # 대상 레포가 모두 공개라 기본 토큰으로 읽을 수 있다. (익명 60회/시간 제한 회피용)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-issues.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/issues.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/issues.json
          git commit -m 'chore: refresh feedback issues'
          git push
